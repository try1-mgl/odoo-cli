[project]
name = "odoo-cli"
version = "0.1.0"
description = "Terminal Client & MCP Server for Odoo ERP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Surya", email = "terrasurya88@gmail.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "simpleeval>=0.9.13",
]

[project.scripts]
odoo-cli = "odoo_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
