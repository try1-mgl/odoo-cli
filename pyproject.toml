[project]
name = "odoo-cli"
version = "0.1.0"
description = "Terminal Client & MCP Server for Odoo ERP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Surya", email = "terrasurya88@gmail.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "simpleeval>=0.9.13",
]

[project.scripts]
odoo-cli = "odoo_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "commitizen>=4.16.4",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = []
